<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#121a37">
<title>Sofia’s Advent Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#121a37;
  --night:#24305f;
  --snow:#f5f8ff;
  --frost:#c7d3f2;
  --glow:#ffcf73;
  --garnet:#a50044;
  --blau:#1f5fb0;
  --pine:#2c6656;
  --ink:#1b2547;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--deep)}
body{
  margin:0;min-height:100%;
  font-family:"Fredoka",ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  color:var(--snow);
  background:linear-gradient(180deg,#24305f 0%,#24305f 12%,#33448a 45%,#5d6db0 72%,#9aa9e0 90%,#dfe6fb 100%);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
#snow{position:fixed;inset:0;pointer-events:none;z-index:3}
main{position:relative;z-index:1;max-width:520px;margin:0 auto}

/* ---------- Hero ---------- */
.hero{position:relative;text-align:center;padding:60px 20px 0;isolation:isolate}
.hero::before{content:"";position:absolute;z-index:-3;top:calc(-1 * env(safe-area-inset-top,0px));bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:linear-gradient(180deg,#0f1630 0%,#18214a 50%,#24305f 100%)}
.aurora{position:absolute;z-index:-2;left:50%;top:-20px;width:100vw;height:300px;transform:translateX(-50%);overflow:hidden;pointer-events:none;opacity:.55}
.aurora i{position:absolute;border-radius:50%;filter:blur(38px);mix-blend-mode:screen}
.aurora .a1{left:-10%;top:40px;width:70%;height:90px;background:linear-gradient(90deg,transparent,#3fe0b0,#47c9e6,transparent);transform:rotate(-8deg);animation:drift 16s ease-in-out infinite alternate}
.aurora .a2{right:-12%;top:20px;width:65%;height:80px;background:linear-gradient(90deg,transparent,#8f7bff,#e07bd8,transparent);transform:rotate(10deg);animation:drift 20s ease-in-out infinite alternate-reverse;opacity:.8}
@keyframes drift{from{translate:-6% 0}to{translate:8% 14px}}
.stars{position:absolute;z-index:-1;left:50%;width:100vw;transform:translateX(-50%);top:0;height:420px;pointer-events:none}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.15}}
.shoot{position:absolute;z-index:-1;top:70px;left:10%;width:110px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);transform:rotate(18deg);opacity:0;animation:shoot 12s linear infinite 3s}
@keyframes shoot{0%{opacity:0;translate:0 0}2%{opacity:1}7%{opacity:0;translate:260px 90px}100%{opacity:0;translate:260px 90px}}
.moon{position:absolute;z-index:-1;top:30px;right:24px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 38% 36%,#fffdf6 0%,#fff0c9 55%,#f2d491 100%);box-shadow:0 0 50px 16px rgba(255,224,160,.25),0 0 120px 40px rgba(255,224,160,.08)}
.moon::after{content:"";position:absolute;left:15px;top:31px;width:9px;height:9px;border-radius:50%;background:rgba(214,180,110,.35);box-shadow:21px -15px 0 -2px rgba(214,180,110,.3),10px -2px 0 -3px rgba(214,180,110,.25)}
h1{font-weight:700;font-size:clamp(2.2rem,9.6vw,3.3rem);line-height:.98;margin:0 0 16px;letter-spacing:.005em;color:#fff;text-shadow:0 3px 0 rgba(15,22,48,.45),0 0 34px rgba(255,207,115,.28)}
h1 .flake{display:inline-block;color:var(--glow);font-size:.5em;vertical-align:.55em;margin:0 .12em}
.sub{margin:0 auto;max-width:28ch;font-size:1.07rem;line-height:1.45;color:var(--frost)}
.progress{display:inline-flex;align-items:center;gap:12px;margin-top:22px;padding:9px 18px;border-radius:999px;background:rgba(245,248,255,.1);border:1px solid rgba(245,248,255,.2);font-weight:500;backdrop-filter:blur(4px)}
.bar{position:relative;width:124px;height:9px;border-radius:9px;background:rgba(245,248,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe6ad,var(--glow));border-radius:9px;transition:width 1s ease;box-shadow:0 0 12px var(--glow)}
.notice{margin:16px auto 0;max-width:32ch;color:var(--glow);font-size:1.02rem;line-height:1.4}
.test{display:inline-flex;gap:10px;align-items:center;margin-top:14px;font-size:.92rem;color:var(--frost)}
.test button{font:inherit;font-size:.9rem;padding:6px 12px;border-radius:999px;border:1px solid rgba(245,248,255,.4);background:transparent;color:var(--snow);cursor:pointer}
.ridge{display:block;width:calc(100% + 40px);margin:30px -20px -1px;height:auto}

/* ---------- Trail ---------- */
#trail{display:block;width:100%;height:auto;overflow:visible}
.road{fill:none;stroke:rgba(245,248,255,.12);stroke-width:28;stroke-linecap:round}
.steps{fill:none;stroke:rgba(245,248,255,.5);stroke-width:4;stroke-linecap:round;stroke-dasharray:1 14;transition:opacity .8s}
.cord{fill:none;stroke:#1c2a3a;stroke-width:1.6;opacity:0;transition:opacity .8s}
.bulbs{fill:none;stroke-width:8;stroke-linecap:round;stroke-dasharray:0 48;opacity:0;transition:opacity .8s}
.bulbs.c1{stroke:#ffcf73}
.bulbs.c2{stroke:#ff7aa2;stroke-dashoffset:-16}
.bulbs.c3{stroke:#8ec2ff;stroke-dashoffset:-32}
.lit .steps{opacity:0}
.lit .cord{opacity:.9}
.lit .bulbs{opacity:1}
.lit .bulbs.c1{animation:tw 2.6s ease-in-out infinite}
.lit .bulbs.c2{animation:tw 2.6s ease-in-out infinite .85s}
.lit .bulbs.c3{animation:tw 2.6s ease-in-out infinite 1.7s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.45}}

.st .halo{fill:var(--glow);opacity:0}
.st .ball{fill:url(#gFrost);stroke:rgba(245,248,255,.5);stroke-width:2}
.st .cap{fill:#cdb37c}
.st .loop{fill:none;stroke:#cdb37c;stroke-width:2}
.st .shine{fill:#fff;opacity:.45}
.st .shine2{fill:#fff;opacity:.3}
.st .band{fill:none;stroke:rgba(255,255,255,.18);stroke-width:3}
.st .num{fill:rgba(245,248,255,.7);font-weight:600;font-size:18px;text-anchor:middle;dominant-baseline:central;font-family:inherit;pointer-events:none}
.st .date{paint-order:stroke;stroke:rgba(27,37,71,.45);stroke-width:3px;stroke-linejoin:round;fill:rgba(245,248,255,.8);font-size:11.5px;font-weight:500;text-anchor:middle;font-family:inherit;pointer-events:none}
.st.open,.st.waiting,.st.solved,.st.testable{cursor:pointer}
.st.open .ball{fill:url(#gGold);stroke:#fff6dd;stroke-width:3}
.st.open .num{fill:var(--ink)}
.st.open .date{fill:var(--glow)}
.st.open .cap,.st.solved .cap{fill:var(--glow)}
.st.open .loop,.st.solved .loop{stroke:var(--glow)}
.st.open .halo{opacity:.35;transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
.st.waiting .ball{stroke:var(--glow);stroke-dasharray:5 5}
.st.waiting .date{fill:var(--glow)}
.st.solved .ball{stroke:rgba(255,255,255,.9);stroke-width:2}
.st.solved.g .ball{fill:url(#gGarnet)}
.st.solved.b .ball{fill:url(#gBlue)}
.st.solved .num{fill:#fff}
.st.solved .band{stroke:rgba(255,215,140,.65)}
.st.gift .box{fill:url(#gFrost);stroke:rgba(245,248,255,.5);stroke-width:2}
.st.gift .lid{fill:#5a69ab}
.st.gift .ribbon{fill:rgba(245,248,255,.55)}
.st.gift.open .box,.st.gift.solved .box{fill:url(#gGarnet);stroke:#fff}
.st.gift.open .lid,.st.gift.solved .lid{fill:#c21a5c}
.st.gift.open .ribbon,.st.gift.solved .ribbon{fill:var(--glow)}
.st.gift.open .num{fill:#fff}
.st:focus{outline:none}
.st:focus-visible .ball,.st:focus-visible .box{stroke:#fff;stroke-width:4}
.st .body{transform-box:fill-box;transform-origin:center}
.st.pop .body{animation:pop .9s ease}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.45);opacity:.06}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.3) rotate(-8deg)}60%{transform:scale(.94) rotate(4deg)}100%{transform:scale(1)}}

/* scenery */
.tree{fill:var(--pine)}
.tree.d{fill:#22544a}
.tree-snow{fill:var(--snow)}
.trunk{fill:#5b4636}
.cabin-wall{fill:#7a4b3a}
.cabin-roof{fill:var(--snow)}
.cabin-win{fill:var(--glow)}
.lamp-glow{fill:var(--glow);opacity:.18}
.ground{fill:var(--snow)}
.bigstar{fill:#7c8bc9;transition:fill .8s}
.bigstar-glow{fill:var(--glow);opacity:0;transition:opacity .8s}
.done .bigstar{fill:var(--glow)}
.done .bigstar-glow{opacity:.45}
.treelights circle{opacity:.35;transition:opacity .8s}
.treelights circle.on{opacity:1;animation:tw 2.4s ease-in-out infinite}

/* penguin */
#buddy{transition:transform 1.1s cubic-bezier(.45,.05,.3,1)}
#buddy .hop{transform-box:fill-box;transform-origin:center bottom}
#buddy.moving .hop{animation:hop .55s ease-in-out 2}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
#buddy .wing{transform-box:fill-box;transform-origin:top center;animation:wave 3s ease-in-out infinite}
@keyframes wave{0%,80%,100%{transform:rotate(0)}88%{transform:rotate(-28deg)}94%{transform:rotate(-8deg)}}

footer{position:relative;text-align:center;color:var(--ink);font-size:.98rem;padding:0 20px 56px;margin-top:-6px}
footer::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:var(--snow)}

/* ---------- Sheet ---------- */
dialog{overflow:visible;border:none;padding:0;margin:auto auto 0;width:min(520px,100%);max-width:100%;background:transparent;color:var(--ink)}
dialog::backdrop{background:rgba(12,17,38,.6);backdrop-filter:blur(3px)}
dialog[open] .sheet{animation:rise .38s cubic-bezier(.2,.9,.3,1.1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet{position:relative;background:var(--snow);border-radius:30px 30px 0 0;padding:54px 24px calc(28px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25);text-align:center;background-image:radial-gradient(circle at 12% 18%,rgba(31,95,176,.07) 0 3px,transparent 4px),radial-gradient(circle at 86% 30%,rgba(165,0,68,.07) 0 4px,transparent 5px),radial-gradient(circle at 70% 80%,rgba(31,95,176,.06) 0 3px,transparent 4px)}
@media (min-width:560px){dialog{margin:auto}.sheet{border-radius:30px;padding-bottom:28px}}
.badge{position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:78px;height:86px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.sheet h2{margin:0 0 2px;font-weight:600;font-size:1.6rem}
.sheet .when{margin:0 0 14px;color:#7a84ad;font-size:.95rem}
.sheet p{margin:0 auto 16px;max-width:34ch;line-height:1.5;color:#46507a}
.sheet .msg{font-size:1.2rem;color:var(--ink);line-height:1.45}
form{text-align:left}
label{display:block;font-weight:500;margin-bottom:8px;color:var(--ink)}
input{width:100%;font:inherit;font-size:1.15rem;padding:14px 16px;border-radius:16px;border:2px solid var(--frost);background:#fff;color:var(--ink)}
input:focus{outline:none;border-color:var(--blau);box-shadow:0 0 0 4px rgba(31,95,176,.15)}
.row{display:flex;gap:10px;margin-top:14px}
button{font:inherit;font-weight:500;font-size:1.05rem;border:none;border-radius:16px;padding:14px 18px;cursor:pointer}
.primary{flex:1;background:var(--garnet);color:#fff;box-shadow:0 4px 0 #74002f}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #74002f}
.primary:disabled{opacity:.6;cursor:wait}
.ghost{background:transparent;color:#46507a}
button:focus-visible{outline:3px solid var(--blau);outline-offset:2px}
.err{min-height:1.4em;margin:10px 0 0;color:var(--garnet);font-size:.98rem;max-width:none}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- Finale ---------- */
#finale{position:fixed;inset:0;z-index:4;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 36%,#4a5fae 0%,#24305f 50%,var(--deep) 100%);overflow:auto}
#finale.show{display:flex}
#finale::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,207,115,.25),transparent 45%);pointer-events:none}
.gift{position:relative;max-width:460px;text-align:center}
.gift h2{font-weight:700;font-size:clamp(2.2rem,9vw,3.1rem);margin:18px 0 12px;line-height:1.05}
.gift p{color:var(--frost);line-height:1.55;font-size:1.14rem}
.giftbox{width:150px;height:150px;margin:0 auto;overflow:visible}
.lidg{transform-box:fill-box;transform-origin:left bottom}
#finale.show .lidg{animation:lift 1.3s .35s cubic-bezier(.3,1.5,.5,1) both}
@keyframes lift{from{transform:translateY(0) rotate(0)}to{transform:translateY(-30px) rotate(-14deg)}}
.rays{transform-box:fill-box;transform-origin:center;opacity:0}
#finale.show .rays{animation:rays 1.4s .5s ease-out both, spin 24s linear 1.9s infinite}
@keyframes rays{from{opacity:0;transform:scale(.4)}to{opacity:.9;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.gift button{margin-top:24px;background:var(--snow);color:var(--ink)}

@media (prefers-reduced-motion:reduce){
  .aurora i,.star,.shoot,.lit .bulbs,.treelights circle.on,.st.open .halo,.st.pop .body,#buddy .wing,#buddy.moving .hop,.shake,dialog[open] .sheet,#finale.show .lidg,#finale.show .rays{animation:none}
  #finale.show .rays{opacity:.5}
  .bar i,#buddy{transition:none}
}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<main>
  <section class="hero">
    <div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i></div>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <i class="shoot" aria-hidden="true"></i>
    <div class="moon" aria-hidden="true"></div>
    <h1>Sofia’s<br>Advent Calendar</h1>
    <div class="progress" aria-live="polite"><span id="count">0 of 24</span><span class="bar"><i id="barfill"></i></span></div>
    <p class="notice" id="notice" hidden></p>
    <div class="test" id="testbar" hidden><span>Test version: dates unlocked</span><button type="button" id="reset">Start over</button></div>
    <svg class="ridge" viewBox="0 0 360 74" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 74 L0 44 L42 20 L72 36 L112 6 L152 38 L192 14 L232 40 L272 10 L312 34 L360 18 L360 74Z" fill="#2c3b78"/>
      <path d="M112 6 L126 17 L118 16 L112 20 L105 16 L97 17Z M272 10 L285 20 L278 19 L272 23 L266 19 L259 20Z M192 14 L203 23 L196 22 L192 25 L187 22 L181 23Z M42 20 L52 27 L46 26 L42 29 L38 26 L32 27Z" fill="#e8eeff" opacity=".85"/>
      <path d="M0 74 L0 56 L60 40 L120 58 L180 44 L240 60 L300 46 L360 58 L360 74Z" fill="#24305f"/>
    </svg>
  </section>

  <svg id="trail" role="list" aria-label="Advent calendar with 24 stations">
    <defs>
      <radialGradient id="gGold" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#fff5d6"/><stop offset=".45" stop-color="#ffd27a"/><stop offset="1" stop-color="#d9982f"/></radialGradient>
      <radialGradient id="gGarnet" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ec5a8f"/><stop offset=".5" stop-color="#a50044"/><stop offset="1" stop-color="#5e0027"/></radialGradient>
      <radialGradient id="gBlue" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#6aa6ee"/><stop offset=".5" stop-color="#1f5fb0"/><stop offset="1" stop-color="#10356a"/></radialGradient>
      <radialGradient id="gFrost" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#8190cd"/><stop offset="1" stop-color="#3b4a8b"/></radialGradient>
      <radialGradient id="gLamp"><stop offset="0" stop-color="#ffcf73" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf73" stop-opacity="0"/></radialGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
  </svg>
  <footer>Made with love, for you.</footer>
</main>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet">
    <svg class="badge" viewBox="0 0 78 86" aria-hidden="true">
      <path d="M35 4 C35 -2 43 -2 43 4" fill="none" stroke="#ffcf73" stroke-width="2.5"/>
      <rect x="32" y="4" width="14" height="10" rx="3" fill="#ffcf73"/>
      <circle cx="39" cy="50" r="34" fill="url(#bGrad)" stroke="#f5f8ff" stroke-width="4"/>
      <path d="M8 46 Q39 56 70 46" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="3"/>
      <ellipse cx="27" cy="37" rx="8" ry="5" fill="#fff" opacity=".45" transform="rotate(-35 27 37)"/>
      <text id="badgeNum" x="39" y="52" text-anchor="middle" dominant-baseline="central" font-family="Fredoka, sans-serif" font-weight="600" font-size="24" fill="#fff">1</text>
      <defs><radialGradient id="bGrad" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ec5a8f"/><stop offset=".5" stop-color="#a50044"/><stop offset="1" stop-color="#5e0027"/></radialGradient></defs>
    </svg>
    <div id="sheetBody"></div>
  </div>
</dialog>

<div id="finale" role="dialog" aria-modal="true" aria-labelledby="finaleTitle">
  <div class="gift">
    <svg class="giftbox" viewBox="0 0 150 150" aria-hidden="true">
      <defs><radialGradient id="gRay" gradientUnits="userSpaceOnUse" cx="75" cy="95" r="150"><stop offset="0" stop-color="#ffe3a3" stop-opacity=".9"/><stop offset=".5" stop-color="#ffcf73" stop-opacity=".25"/><stop offset="1" stop-color="#ffcf73" stop-opacity="0"/></radialGradient></defs><circle cx="75" cy="95" r="70" fill="url(#gRay)" opacity=".6"/><g class="rays"><path d="M75 95 L224.6 84.5 L224.6 105.5Z M75 95 L217.3 142.6 L209.2 162.0Z M75 95 L188.2 193.4 L173.4 208.2Z M75 95 L142.0 229.2 L122.6 237.3Z M75 95 L85.5 244.6 L64.5 244.6Z M75 95 L27.4 237.3 L8.0 229.2Z M75 95 L-23.4 208.2 L-38.2 193.4Z M75 95 L-59.2 162.0 L-67.3 142.6Z M75 95 L-74.6 105.5 L-74.6 84.5Z M75 95 L-67.3 47.4 L-59.2 28.0Z M75 95 L-38.2 -3.4 L-23.4 -18.2Z M75 95 L8.0 -39.2 L27.4 -47.3Z M75 95 L64.5 -54.6 L85.5 -54.6Z M75 95 L122.6 -47.3 L142.0 -39.2Z M75 95 L173.4 -18.2 L188.2 -3.4Z M75 95 L209.2 28.0 L217.3 47.4Z" fill="url(#gRay)"/></g>
      <rect x="27" y="68" width="96" height="72" rx="12" fill="#a50044"/>
      <rect x="67" y="68" width="16" height="72" fill="#ffcf73"/>
      <g class="lidg">
        <rect x="19" y="50" width="112" height="24" rx="9" fill="#c21a5c"/>
        <rect x="67" y="50" width="16" height="24" fill="#ffcf73"/>
        <path d="M75 50 C53 20 29 36 45 46 C51 50 65 50 75 50 C85 50 99 50 105 46 C121 36 97 20 75 50Z" fill="#ffcf73"/>
      </g>
    </svg>
    <h2 id="finaleTitle">You made it!</h2>
    <div id="giftContent"></div>
    <button type="button" id="finaleClose">Back to the calendar</button>
  </div>
</div>

<script>
/* ============ SETTINGS ============ */
const CONFIG = {
  YEAR: 2026,
  DATE_LOCK: true,          // station n opens on December n
  TEST_MODE: false,      // true = dates unlocked, "Start over" button, nothing synced

  // Cross-device progress (Firebase Firestore). Leave empty = browser only.
  FIREBASE_PROJECT_ID: "",
  FIREBASE_API_KEY: "",

  // Push notification to Philipp via ntfy.sh. Leave empty = off.
  NTFY_TOPIC: "",

  // Shown after station 24.
  GIFT_HTML: `<p>Your gift goes here.</p>`,
};

// Stations whose answer is a date, typed as DD/MM/YYYY.
const DATE_STATIONS = [12];

// Message after each solved station.
const MESSAGES = [
  "That’s exactly where I saw you for the very first time. This is where your Advent calendar begins.",
  "The best banana bread anyone has ever baked for me.",
  "I still think about that mousse au chocolat.",
  "I almost skipped The Weeknd for you. I’d do it again.",
  "The sweetest welcome to Regensburg came from you.",
  "Strike! Station 6 done.",
  "Raphael it is. Though to you he’ll always be Raphinha.",
  "A Monday that changed quite a lot.",
  "582 minutes on a train, and every single one was worth it.",
  "1899. The year your club was born.",
  "Warm water, cold air and you. A really good day.",
  "Thanks for asking Paula. I bet she smiled.",
  "Two legends from Porto Alegre. You’re past halfway.",
  "Addis Ababa! You research like a detective.",
  "A Swiss man founded your favourite club. Who knew?",
  "Henry II. So we went swimming in an imperial spa.",

const norm = s => s.toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
async function h(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(SALT + norm(s)));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,24);
}

async function readRemote(){
  if(!remoteOn()) return null;
  try{
    const r = await fetch(docUrl()+`?key=${CONFIG.FIREBASE_API_KEY}`);
    if(r.status===404) return 0;
    if(!r.ok) return null;
    const d = await r.json();
    return parseInt(d.fields?.solved?.integerValue||"0",10)||0;
  }catch(e){ return null; }
}
async function writeRemote(n){
  if(!remoteOn()) return;
  try{
    await fetch(docUrl()+`?key=${CONFIG.FIREBASE_API_KEY}&updateMask.fieldPaths=solved&updateMask.fieldPaths=updated`,{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({fields:{solved:{integerValue:String(n)},updated:{timestampValue:new Date().toISOString()}}})

}

function until(n){
  const ms = openDate(n) - new Date(); const min = Math.max(1,Math.ceil(ms/60000));
  const d = Math.floor(min/1440), hh = Math.floor((min%1440)/60), mm = min%60;
  if(d>=1) return `${d} day${d>1?"s":""}${hh?` ${hh} h`:""}`;

el("rect",{x:-11.5,y:-21,width:23,height:4.5,rx:2.2,fill:"#1f5fb0"},hop);
el("circle",{cx:0,cy:-30,r:3.4,fill:"#fff"},hop);
// scarf with blaugrana stripes
el("rect",{x:-12,y:-5,width:24,height:6,rx:3,fill:"#a50044"},hop);
el("rect",{x:-4,y:-5,width:5,height:6,fill:"#1f5fb0"},hop);
el("rect",{x:6,y:-5,width:4,height:6,fill:"#1f5fb0"},hop);
el("path",{d:"M5 0 L11 0 L12 13 L6 13Z",fill:"#a50044"},hop);
el("rect",{x:6.3,y:4,width:5,height:3,fill:"#1f5fb0"},hop);
el("path",{d:"M6 13 L7 15.5 M8.5 13 L9 15.5 M11 13 L11.6 15.5",stroke:"#ffcf73","stroke-width":1.2},hop);

function placeBuddy(animate){
  const i=Math.min(solved,TOTAL-1), p=pts[i];
  const side = i===TOTAL-1 ? 1 : (p.x<W/2 ? 1 : -1);
  const x = p.x + side*52, y = p.y + 6;
  buddy.style.transform=`translate(${x}px, ${y}px)`;
  if(animate){ buddy.classList.remove("moving"); void buddy.getBBox(); buddy.classList.add("moving"); setTimeout(()=>buddy.classList.remove("moving"),1200); }
}

function render(popN){
  stations.forEach((g,i)=>{
    const n=i+1;
    g.classList.remove("open","solved","waiting","pop");
    let label;
    if(n<=solved){ g.classList.add("solved"); g.setAttribute("tabindex","0"); label=`Station ${n}, solved`; }
    else if(n===solved+1){
      if(dateOk(n)){ g.classList.add("open"); label=`Station ${n}, ready`; }
      else { g.classList.add("waiting"); label=`Station ${n}, opens on December ${n}`; }
      g.setAttribute("tabindex","0");
    } else { g.setAttribute("tabindex", preview?"0":"-1"); label=`Station ${n}, locked`; }
    g.classList.toggle("testable", preview && n>solved+1);
    g.setAttribute("aria-label",label);
  });
  segs.forEach((s,i)=>s.classList.toggle("lit", i+2<=solved));
  treeBulbs.forEach((c,i)=>c.classList.toggle("on", solved>=TOTAL || i < Math.floor(solved/TOTAL*treeBulbs.length)));
  BT.classList.toggle("done", solved>=TOTAL);
  document.getElementById("count").textContent = `${solved} of ${TOTAL}`;
  document.getElementById("barfill").style.width = (solved/TOTAL*100)+"%";
  updateNotice();
  document.getElementById("testbar").hidden=!preview;
  placeBuddy(!!popN);
  if(popN){ void stations[popN-1].getBBox(); stations[popN-1].classList.add("pop"); }
}
function updateNotice(){
  const notice=document.getElementById("notice");
  const next=solved+1;
  if(!preview && next<=TOTAL && !dateOk(next)){
    notice.hidden=false;
    notice.textContent = solved===0 ? `Your Advent calendar opens in ${until(1)}. Until then: patience and chocolate.` : `Station ${next} opens in ${until(next)}.`;
  } else if(solved>=TOTAL){ notice.hidden=false; notice.textContent="All 24 ornaments are glowing. Merry Christmas, Sofia."; }
  else notice.hidden=true;
}
setInterval(updateNotice,30000);

/* ---------- Sheet ---------- */
const sheet=document.getElementById("sheet"), body=document.getElementById("sheetBody");
const badgeNum=document.getElementById("badgeNum"), badgeStop=document.querySelectorAll("#bGrad stop");
function setBadge(n, state){
  badgeNum.textContent=n;
  const cols = state==="solved" ? (n%2?["#ec5a8f","#a50044","#5e0027"]:["#6aa6ee","#1f5fb0","#10356a"]) : state==="open" ? ["#fff5d6","#ffd27a","#d9982f"] : ["#8190cd","#5a69ab","#3b4a8b"];
  badgeStop.forEach((s,i)=>s.setAttribute("stop-color",cols[i]));
  badgeNum.setAttribute("fill", state==="open" ? "#1b2547" : "#fff");
}
function closeSheet(){ sheet.close(); }
sheet.addEventListener("click",e=>{ if(e.target===sheet) closeSheet(); });
const head = n => `<h2 id="sheetTitle">Station ${n}</h2><p class="when">${dayName(n)}, December ${n}</p>`;

function openStation(n){
  if(n>solved+1 && !preview) return;
  if(n<=solved){
    setBadge(n,"solved");
    body.innerHTML = head(n)+`<p class="msg"></p><div class="row"><button class="primary" type="button" data-close>Close</button></div>`;
    body.querySelector(".msg").textContent = MESSAGES[n-1];
    if(n===TOTAL){ body.querySelector(".row").insertAdjacentHTML("afterbegin",`<button class="ghost" type="button" id="reGift">See your gift</button>`); body.querySelector("#reGift").onclick=()=>{closeSheet();showFinale();}; }
  } else if(!dateOk(n)){
    setBadge(n,"waiting");
    body.innerHTML = head(n)+`<p>This ornament lights up in ${until(n)}. Until then, keep the note from door ${n} somewhere safe.</p><div class="row"><button class="primary" type="button" data-close>Got it</button></div>`;
  } else {
    setBadge(n,"open");
    const isDate = DATE_STATIONS.includes(n);
    body.innerHTML = head(n)+`
      <p>Your question is on the note behind door ${n}.</p>
      <form id="f" novalidate>
        <label for="ans">${isDate?"Your answer (DD/MM/YYYY)":"Your answer"}</label>
        <input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"${isDate?' inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10"':''}>
        <p class="err" id="err" role="alert"></p>
        <div class="row"><button class="ghost" type="button" data-close>Cancel</button><button class="primary" type="submit">Light it up</button></div>
      </form>`;
    let tries=0;
    if(isDate){
      const di=body.querySelector("#ans");
      di.addEventListener("focus",()=>setTimeout(()=>{ const l=di.value.length; di.setSelectionRange(l,l); },0));
      di.addEventListener("input",()=>{
        body.querySelector("#err").textContent="";
        const d=di.value.replace(/\D/g,"").slice(0,8);
        di.value = d.length>4 ? `${d.slice(0,2)}/${d.slice(2,4)}/${d.slice(4)}` : d.length>2 ? `${d.slice(0,2)}/${d.slice(2)}` : d;
      });
    }
    body.querySelector("#f").addEventListener("submit", async e=>{
      e.preventDefault();
      const inp=body.querySelector("#ans"), err=body.querySelector("#err"), btn=body.querySelector(".primary");
      if(!norm(inp.value)){ err.textContent="Type an answer first."; return; }
      if(isDate && !/^\d{2}\/\d{2}\/\d{4}$/.test(inp.value)){ err.textContent="Please enter the full date as DD/MM/YYYY."; return; }
      btn.disabled=true;
      const ok=(HASHES[n]||[]).includes(await h(inp.value));
      btn.disabled=false;
      if(ok){ await solve(n); }
      else{
        tries++;
        err.textContent = tries<3 ? "Not quite. Check the spelling and try again." : "Still not it. Read the question once more, the trick is often in a single word.";
        inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
        inp.select();
      }
    });
  }
  body.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
  sheet.showModal();
  const inp=body.querySelector("#ans"); if(inp) setTimeout(()=>inp.focus(),60);
}

async function solve(n){
  solved=Math.max(solved,n); writeLocal(n); render(n);
  writeRemote(n); notify(n);
  sparkle();
  if(n===TOTAL){ closeSheet(); setTimeout(showFinale,700); return; }
  setBadge(n,"solved");
  const next = dateOk(n+1) ? `Ornament ${n+1} is already waiting for you.` : `See you tomorrow at ornament ${n+1}.`;
  body.innerHTML = `<h2 id="sheetTitle">Ornament ${n} is glowing</h2><p class="when">${dayName(n)}, December ${n}</p><p class="msg"></p><p>${next}</p><div class="row"><button class="primary" type="button" data-close>Continue</button></div>`;
  body.querySelector(".msg").textContent = MESSAGES[n-1];
  body.querySelector("[data-close]").onclick=closeSheet;
  body.querySelector("[data-close]").focus();
}

/* ---------- Finale ---------- */
const finale=document.getElementById("finale");
function showFinale(){
  const c=document.getElementById("giftContent");
  c.innerHTML="<p></p>"+CONFIG.GIFT_HTML;
  c.firstChild.textContent=MESSAGES[TOTAL-1];
  finale.classList.remove("show"); void finale.offsetWidth; finale.classList.add("show");
  burst(); setTimeout(burst,700); setTimeout(burst,1400);
  document.getElementById("finaleClose").focus();
}
document.getElementById("finaleClose").onclick=()=>finale.classList.remove("show");
document.getElementById("reset").onclick=()=>{ solved=0; writeLocal(0); render(); scrollTo({top:0,behavior:"smooth"}); };

/* ---------- Snow & sparkles ---------- */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv=document.getElementById("snow"), cx=cv.getContext("2d");
let flakes=[], extra=[], running=false;
function size(){ cv.width=innerWidth*devicePixelRatio; cv.height=innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
size(); addEventListener("resize",size);
for(let i=0;i<90;i++){ const z=Math.random(); flakes.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.7+z*2.8,s:.2+z*.9,d:Math.random()*6,o:.35+z*.6}); }
const COLS=["#ffcf73","#ec5a8f","#6aa6ee","#f5f8ff"];
function burst(){ if(reduce) return; const ox=innerWidth*(.3+Math.random()*.4), oy=innerHeight*(.3+Math.random()*.15); for(let i=0;i<110;i++){ const a=Math.random()*Math.PI*2, v=2+Math.random()*7; extra.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,r:1.8+Math.random()*3.2,life:120+Math.random()*40,c:COLS[i%4],star:i%5===0}); } kick(); }
function sparkle(){ if(reduce) return; for(let i=0;i<46;i++) extra.push({x:innerWidth/2,y:innerHeight*.5,vx:(Math.random()-.5)*7,vy:(Math.random()-.95)*7,r:1.5+Math.random()*2.6,life:85,c:i%2?"#ffcf73":"#f5f8ff",star:i%4===0}); kick(); }
function starPath(x,y,r){ cx.beginPath(); for(let k=0;k<10;k++){ const a=k*Math.PI/5-Math.PI/2, rr=k%2?r*.45:r*1.6; cx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } cx.closePath(); }
function tick(t){
  cx.clearRect(0,0,innerWidth,innerHeight);
  cx.fillStyle="#f5f8ff";
  for(const f of flakes){
    if(!reduce){ f.y+=f.s; f.x+=Math.sin(t/1700+f.d)*.35; if(f.y>innerHeight+5){f.y=-5;f.x=Math.random()*innerWidth;} }
    cx.globalAlpha=f.o; cx.beginPath(); cx.arc(f.x,f.y,f.r,0,7); cx.fill();
  }
  extra=extra.filter(p=>p.life-->0);
  for(const p of extra){ p.x+=p.vx; p.y+=p.vy; p.vy+=.14; p.vx*=.985; cx.fillStyle=p.c; cx.globalAlpha=Math.min(1,p.life/40); if(p.star) starPath(p.x,p.y,p.r); else { cx.beginPath(); cx.arc(p.x,p.y,p.r,0,7); } cx.fill(); }
  cx.globalAlpha=1;
  if(!reduce || extra.length) requestAnimationFrame(tick); else running=false;
}
function kick(){ if(!running){ running=true; requestAnimationFrame(tick); } }
kick();

/* ---------- Start ---------- */
if('scrollRestoration' in history) history.scrollRestoration='manual';
(async function init(){
  const pv=params.get("vorschau");
  if(pv && await h(pv)===PREVIEW_HASH) preview=true;
  solved=readLocal(); render();
  const remote=await readRemote();
  if(remote!==null){
    if(remote>solved){ solved=remote; writeLocal(solved); render(); }
    else if(solved>remote){ writeRemote(solved); }
  }
  if(solved>2) requestAnimationFrame(()=>{ const p=pts[Math.min(solved,TOTAL-1)], r=svg.getBoundingClientRect(); scrollTo({top: r.top+scrollY + p.y/H*r.height - innerHeight/2}); });
})();
</script>
